# Buoy search with the boat wheeled around on land: no wind, a small area,
# and a lower detection threshold for a buoy sitting on grass.

buoy_detection:
  ros__parameters:
    model_path: ""
    detection_threshold: 0.6  # tune live with the update_detection_threshold topic
    show_frames: false
    save_frames: true  # every 10th frame to ~/boat_images, to review misses

buoy_search:
  ros__parameters:
    search_center_lat: 42.44415534324632  # set to the middle of the field
    search_center_lon: -76.48367002684182
    search_radius: 25.0
    leg_spacing: 10.0  # m, about 2x the range YOLO reliably detects the buoy at
    wind_aligned_pattern: false
    search_direction: 0.0  # legs run perpendicular to this: 0 = north-south legs
    heading_convention: "math"
