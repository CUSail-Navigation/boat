name: Boat CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint Python with Ruff
        uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.14.6"
          args: "check --output-format=github"
      - name: Check Python formatting
        run: ruff format --check .

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Lyrical development image
        run: docker build --pull -t boat-ci setup
      - name: Build workspace and run package tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/src:/home/ros2_user/ros2_ws/src:ro" \
            boat-ci bash -c '
              set -e
              test_status=0
              colcon test --return-code-on-test-failure || test_status=$?
              colcon test-result --verbose
              exit "$test_status"
            '

  teensy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teensy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('teensy/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e teensy40
      - name: Run unit tests
        run: ./test/run_tests.sh
